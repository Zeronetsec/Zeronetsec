name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Zeronetsec
          outputs: |
            .gitaction/github-snake.svg
            .gitaction/github-snake-dark.svg?palette=github-dark
            .gitaction/github-snake-tokyonight.svg?color_snake=%2373daca&color_dots=%231a1b26,%2324283b,%23414868,%2370a5fd,%23bb9af7

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitaction/github-snake.svg .gitaction/github-snake-dark.svg .gitaction/github-snake-tokyonight.svg
          git commit -m "update github snake animation" || exit 0
          git push